name: Build & Release macOS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build macOS App
        run: flutter build macos --release

      - name: Install dependencies (create-dmg)
        run: brew install create-dmg

      - name: Create DMG
        run: |
          create-dmg \
            --volname "Prime Invoice Installer" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --icon "Prime Invoice.app" 200 190 \
            --hide-extension "Prime Invoice.app" \
            --app-drop-link 600 185 \
            "Prime-Invoice-Installer.dmg" \
            "build/macos/Build/Products/Release/Prime Invoice.app"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: Prime-Invoice-Installer.dmg
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
